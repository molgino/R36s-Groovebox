name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # App-Update fuer das Groovebox-OS (arm64, DRM-Ausgabe) -> dist/groovebox-os-update.tgz
  os-app:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Abhaengigkeiten
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libasound2-dev libdrm-dev pkg-config
      - name: Bauen
        run: |
          make -j4 DRM=1
          ./tools/os-update.sh groovebox
      - uses: actions/upload-artifact@v4
        with: { name: groovebox-os-update, path: dist/groovebox-os-update.tgz }

  build:
    needs: os-app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Abhaengigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu libsdl2-dev libasound2-dev zip python3-numpy

      - name: Desktop-Build (Kompilierpruefung)
        run: make

      - name: Cross-Build fuer den R36S (aarch64, ArkOS)
        run: ./tools/cross-build.sh

      - name: Paket
        run: |
          python3 tools/gensamples.py
          ./tools/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: r36s-groovebox-arkos
          path: dist/r36s-groovebox-arkos.zip

      - uses: actions/download-artifact@v4
        with: { name: groovebox-os-update, path: dist }

      - name: Release "nightly" aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/r36s-groovebox-arkos.zip dist/groovebox-os-update.tgz --prerelease \
            --title "Nightly ($(git rev-parse --short HEAD))" \
            --notes "Automatischer Build von main ($(git rev-parse --short HEAD)). ArkOS: r36s-groovebox-arkos.zip. Groovebox-OS: groovebox-os-update.tgz (App-Update ohne neues Image)." --target "$GITHUB_SHA"

      - name: Versions-Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/r36s-groovebox-arkos.zip --title "$GITHUB_REF_NAME" --generate-notes

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Abhaengigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu libsdl2-dev libasound2-dev zip python3-numpy

      - name: Desktop-Build (Kompilierpruefung)
        run: make

      - name: Cross-Build fuer den R36S (aarch64, ArkOS)
        run: ./tools/cross-build.sh

      - name: Paket
        run: |
          python3 tools/gensamples.py
          ./tools/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: r36s-groovebox-arkos
          path: dist/r36s-groovebox-arkos.zip

      - name: Release "nightly" aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly dist/r36s-groovebox-arkos.zip --prerelease \
            --title "Nightly ($(git rev-parse --short HEAD))" \
            --notes "Automatischer Build von main ($(git rev-parse --short HEAD))." --target "$GITHUB_SHA"

      - name: Versions-Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/r36s-groovebox-arkos.zip --title "$GITHUB_REF_NAME" --generate-notes
